name: RC Smoke

on:
  workflow_dispatch:
    inputs:
      rc_version:
        description: 'Published RC version (X.Y.Z-rcN)'
        required: true
        type: string
      release_branch:
        description: 'Release branch (releases/X.x.x/X.Y.x/X.Y.Z-rcN)'
        required: true
        type: string

concurrency:
  group: rc-smoke-${{ github.workflow }}-${{ inputs.rc_version }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  decide:
    name: Decide if smoke should run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      rc_version: ${{ steps.gate.outputs.rc_version }}
      release_branch: ${{ steps.gate.outputs.release_branch }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          RC: ${{ inputs.rc_version }}
          BR: ${{ inputs.release_branch }}
        run: |
          set -eo pipefail
          if ! [[ "$RC" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Invalid RC version input: '$RC'."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! [[ "$BR" =~ ^releases/ ]]; then
            echo "Release branch input '$BR' is not a release branch."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          HEAD_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/${BR}" --jq '.object.sha')
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "rc_version=$RC" >> "$GITHUB_OUTPUT"
          echo "release_branch=$BR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Will run smoke for RC=$RC branch=$BR sha=$HEAD_SHA"

  resolve:
    name: Resolve RC artifact on npm
    needs: decide
    if: ${{ needs.decide.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll npm registry for RC visibility
        env:
          RC: ${{ needs.decide.outputs.rc_version }}
        run: |
          set -eo pipefail
          deadline=$(( $(date +%s) + 900 ))  # 15 min
          while true; do
            if curl -fsSL "https://registry.npmjs.org/appsflyer-capacitor-plugin/$RC" | jq -e '.version == "'"$RC"'"' > /dev/null; then
              echo "Found appsflyer-capacitor-plugin@$RC on registry."
              break
            fi
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for $RC on registry"
              exit 1
            fi
            echo "Not yet visible; retrying in 30s..."
            sleep 30
          done

  smoke-android:
    name: Android smoke (RC artifact)
    needs: [decide, resolve]
    if: ${{ needs.decide.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.release_branch }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Synthesize qa-test-app-rc-smoke
        env:
          RC: ${{ needs.decide.outputs.rc_version }}
        run: |
          chmod +x ./scripts/synthesize-rc-smoke-app.sh
          ./scripts/synthesize-rc-smoke-app.sh "$RC"

      - name: Write QA test app .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        working-directory: examples/qa-test-app-rc-smoke
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is not set; aborting"
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Install smoke app dependencies (registry RC)
        working-directory: examples/qa-test-app-rc-smoke
        run: npm install

      - name: Validate installed RC package (Android)
        run: |
          chmod +x ./scripts/validate-npm-package-files.sh
          ./scripts/validate-npm-package-files.sh dir-android examples/qa-test-app-rc-smoke/node_modules/appsflyer-capacitor-plugin

      - name: Build web bundle
        working-directory: examples/qa-test-app-rc-smoke
        run: npm run build

      - name: Capacitor sync (android)
        working-directory: examples/qa-test-app-rc-smoke
        run: npx cap sync android

      - name: Run smoke scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # See android-e2e.yml for rationale; mirrors that job's emulator
          # headroom so the warm-app trigger path is consistent across CI.
          cores: 4
          ram-size: 4096M
          emulator-options: -dns-server 8.8.8.8,1.1.1.1 -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          # reactivecircus/android-emulator-runner@v2 runs each `script:` line
          # through a separate `sh -c`, so keep the runner invocation on one
          # line to avoid backslash-continuation breakage.
          script: |
            chmod +x ./scripts/af-scenario-runner.sh
            ./scripts/af-scenario-runner.sh --platform android --plan .af-smoke/rc-test-plan.json --build --verbose

      - name: Upload smoke reports (Android)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-smoke-android-reports
          path: .af-smoke/reports/
          if-no-files-found: warn
          retention-days: 30

  smoke-ios:
    name: iOS smoke (RC artifact)
    needs: [decide, resolve]
    if: ${{ needs.decide.outputs.should_run == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.release_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Synthesize qa-test-app-rc-smoke
        env:
          RC: ${{ needs.decide.outputs.rc_version }}
        run: |
          chmod +x ./scripts/synthesize-rc-smoke-app.sh
          ./scripts/synthesize-rc-smoke-app.sh "$RC"

      - name: Write QA test app .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        working-directory: examples/qa-test-app-rc-smoke
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is not set; aborting"
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Install smoke app dependencies (registry RC)
        working-directory: examples/qa-test-app-rc-smoke
        run: npm install

      - name: Validate installed RC package (iOS)
        run: |
          chmod +x ./scripts/validate-npm-package-files.sh
          ./scripts/validate-npm-package-files.sh dir-ios examples/qa-test-app-rc-smoke/node_modules/appsflyer-capacitor-plugin

      - name: Build web bundle
        working-directory: examples/qa-test-app-rc-smoke
        run: npm run build

      - name: Capacitor sync (ios)
        working-directory: examples/qa-test-app-rc-smoke
        run: npx cap sync ios

      - name: Pick a non-iOS-17.0 simulator
        id: pick-sim
        run: |
          set -eo pipefail
          UDID=$(xcrun simctl list devices available -j | \
            jq -r '
              .devices
              | to_entries[]
              | select(.key | test("iOS-(17-[4-9]|17-[1-9][0-9]|18|19|20|21|22|23|24|25|26)"))
              | .value[]
              | select(.name | test("iPhone"))
              | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::No iOS 17.4+ / 18+ simulator available."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run smoke scenarios
        env:
          IOS_UDID: ${{ steps.pick-sim.outputs.udid }}
        run: |
          chmod +x ./scripts/af-scenario-runner.sh
          ./scripts/af-scenario-runner.sh \
            --platform ios \
            --plan .af-smoke/rc-test-plan.json \
            --build \
            --verbose

      - name: Upload smoke reports (iOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-smoke-ios-reports
          path: .af-smoke/reports/
          if-no-files-found: warn
          retention-days: 30

  post-check-run:
    name: Post rc-smoke/npm check
    needs: [decide, smoke-android, smoke-ios]
    if: ${{ always() && needs.decide.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute conclusion
        id: outcome
        run: |
          a="${{ needs.smoke-android.result }}"
          i="${{ needs.smoke-ios.result }}"
          if [ "$a" = "success" ] && [ "$i" = "success" ]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "summary=Both Android and iOS RC smoke runs passed against npm-pinned ${{ needs.decide.outputs.rc_version }}." >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "summary=RC smoke failed: android=$a ios=$i" >> "$GITHUB_OUTPUT"
          fi
      - name: Post check_run on release branch HEAD
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = "${{ needs.decide.outputs.head_sha }}";
            const conclusion = "${{ steps.outcome.outputs.conclusion }}";
            const summary = `${{ steps.outcome.outputs.summary }}`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'rc-smoke/npm',
              head_sha: sha,
              status: 'completed',
              conclusion,
              output: {
                title: `rc-smoke/npm — ${conclusion}`,
                summary,
              },
            });

  notify-failure:
    name: Notify Slack (smoke failure)
    needs: [decide, smoke-android, smoke-ios]
    # Fire only for genuine smoke regressions (the RC is on npm but smoke is
    # red). Dry-run paths never dispatch this workflow. Production promotion is
    # blocked until rcN+1 is published.
    if: |
      always() &&
      needs.decide.outputs.should_run == 'true' &&
      (needs.smoke-android.result == 'failure' || needs.smoke-ios.result == 'failure' ||
       needs.smoke-android.result == 'cancelled' || needs.smoke-ios.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack failure payload
        id: slack-failure-payload
        env:
          RC_VERSION: ${{ needs.decide.outputs.rc_version }}
          IOS_RESULT: ${{ needs.smoke-ios.result }}
          ANDROID_RESULT: ${{ needs.smoke-android.result }}
          RELEASE_BRANCH: ${{ needs.decide.outputs.release_branch }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const env = process.env;
          const text = [
            '<!here>',
            `:warning: *Capacitor rc-smoke failed for \`${env.RC_VERSION}\`*`,
            '',
            'The RC is published on npm but smoke checks did not pass on the artifact. Production promotion is blocked.',
            '',
            '*Smoke results:*',
            `• iOS: ${env.IOS_RESULT}`,
            `• Android: ${env.ANDROID_RESULT}`,
            '',
            `*Branch:* ${env.RELEASE_BRANCH}`,
            `*Run:* https://github.com/${env.REPOSITORY}/actions/runs/${env.RUN_ID}`,
            '',
            '*Next step:* Bump to `rcN+1` and rerun the RC-release workflow with `dry_run=false`. Republishing the same RC version is not supported by npm.',
          ].join('\n');
          fs.appendFileSync(env.GITHUB_OUTPUT, `payload=${JSON.stringify({ text })}\n`);
          NODE

      - name: Send Slack failure notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: ${{ steps.slack-failure-payload.outputs.payload }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
