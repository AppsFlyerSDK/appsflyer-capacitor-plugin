name: Production Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to publish from (releases/...)'
        required: true
        type: string

concurrency:
  group: production-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm + GitHub release
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'releases/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Create GH release; dispatch npm via PAT
      id-token: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      plugin_version: ${{ steps.ver.outputs.plugin_version }}
      android_sdk_version: ${{ steps.ver.outputs.android_sdk_version }}
      ios_sdk_version: ${{ steps.ver.outputs.ios_sdk_version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.release_branch }}" >> "$GITHUB_OUTPUT"
          else
            # Merged PR — use the merge commit on main; the version is whatever
            # the PR merged (already -rcN-stripped by promote-release.yml).
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert npm OIDC workflow is active
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GH_REPO}/actions/workflows/npm-publish-oidc.yml" --jq '.state' 2>/dev/null || echo "missing")"
          if [ "$state" != "active" ]; then
            echo "::error::npm-publish-oidc.yml is not active on the default branch (state=$state)."
            exit 1
          fi

      - name: Dispatch npm OIDC publish workflow and wait
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          # Dispatch runs before checkout; gh needs an explicit repo (no .git in cwd).
          GH_REPO: ${{ github.repository }}
          GIT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          PREV="$(gh run list --workflow=npm-publish-oidc.yml --branch "$GIT_REF" --limit 1 --json databaseId -q '.[0].databaseId // empty')"
          gh workflow run npm-publish-oidc.yml --ref "$GIT_REF" \
            -f "git_ref=$GIT_REF" \
            -f "dist_tag=latest" \
            -f "dry_run=false"
          run_id=""
          for _ in $(seq 1 120); do
            cur="$(gh run list --workflow=npm-publish-oidc.yml --branch "$GIT_REF" --limit 1 --json databaseId -q '.[0].databaseId // empty')"
            if [[ -n "$cur" && "$cur" != "$PREV" ]]; then
              run_id="$cur"
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Timed out waiting for npm-publish-oidc.yml run to appear for ref $GIT_REF"
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Read versions from package.json
        id: ver
        run: |
          PLUGIN_VERSION=$(jq -r '.version' package.json)
          ANDROID_SDK_VERSION=$(jq -r '.androidSdkVersion' package.json)
          IOS_SDK_VERSION=$(jq -r '.iosSdkVersion' package.json)
          BUILD_NUMBER=$(jq -r '.buildNumber' package.json)
          if ! [[ "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version $PLUGIN_VERSION still has -rcN. Promote step missed?"
            exit 1
          fi
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_sdk_version=$ANDROID_SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ios_sdk_version=$IOS_SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for npm registry visibility
        env:
          VERSION: ${{ steps.ver.outputs.plugin_version }}
        run: |
          set -eo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            if curl -fsSL "https://registry.npmjs.org/appsflyer-capacitor-plugin/$VERSION" | jq -e '.version == "'"$VERSION"'"' > /dev/null; then
              echo "Visible: appsflyer-capacitor-plugin@$VERSION"
              break
            fi
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for $VERSION on registry"
              exit 1
            fi
            sleep 20
          done

      - name: Create GitHub release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        with:
          github-token: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: '${{ steps.ref.outputs.ref }}',
                name: tag,
                draft: false,
                prerelease: false,
                generate_release_notes: false,
              });
            } catch (err) {
              core.setFailed(`Failed to create release: ${err.message}`);
            }

  notify-team:
    name: Notify Slack
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine status and failed stage
        id: status
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            echo "success=true"  >> "$GITHUB_OUTPUT"
            echo "failed_stage=" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "failed_stage=publish" >> "$GITHUB_OUTPUT"
          fi

      # Enrichment runs on the success path only. The failure Slack does not
      # reference any of the outputs below, so a checkout/Jira blip cannot
      # silence the failure notification.
      - name: Checkout merged ref
        if: steps.status.outputs.success == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.ref }}

      - name: Extract changelog snippet
        id: changelog
        if: steps.status.outputs.success == 'true'
        env:
          PLUGIN_VERSION: ${{ needs.publish.outputs.plugin_version }}
        run: |
          set -eo pipefail
          if [ -f "CHANGELOG.md" ]; then
            CHANGES=$(awk "/^## ${PLUGIN_VERSION}/,/^## [0-9]/" CHANGELOG.md | grep '^- ' | sed 's/^- /• /' | head -8)
            if [ -z "$CHANGES" ]; then
              CHANGES="• Check CHANGELOG.md for details"
            fi
          else
            CHANGES="• No CHANGELOG.md present"
          fi
          {
            echo "body<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Jira tickets
        id: jira-tickets
        if: steps.status.outputs.success == 'true'
        continue-on-error: true
        env:
          JIRA_EMAIL: ${{ secrets.CI_JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.CI_JIRA_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.CI_JIRA_DOMAIN }}
          PLUGIN_VERSION: ${{ needs.publish.outputs.plugin_version }}
        run: |
          set +e
          JIRA_FIX_VERSION="Capacitor SDK v${PLUGIN_VERSION}"
          echo "Looking for Jira tickets with fixVersion: $JIRA_FIX_VERSION"

          if [[ -z "$JIRA_EMAIL" || -z "$JIRA_TOKEN" ]]; then
            echo "Jira credentials not configured; skipping ticket fetch"
            echo "tickets=No assigned fix version found" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOMAIN="${JIRA_DOMAIN:-appsflyer.atlassian.net}"

          JQL_QUERY="fixVersion=\"${JIRA_FIX_VERSION}\""
          ENCODED_JQL=$(echo "$JQL_QUERY" | jq -sRr @uri)

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://${DOMAIN}/rest/api/3/search/jql?jql=${ENCODED_JQL}&fields=key,summary&maxResults=20")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Jira HTTP $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Jira API request failed; first 500 bytes of body:"
            echo "$BODY" | head -c 500
            echo "tickets=No assigned fix version found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TICKETS=$(echo "$BODY" | jq -r '.issues[]? | "• https://'"${DOMAIN}"'/browse/\(.key) - \(.fields.summary)"' 2>/dev/null | head -10)
          if [ -z "$TICKETS" ]; then
            echo "tickets=No assigned fix version found" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tickets<<EOF"
              echo "$TICKETS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build Slack success payload
        id: slack-success-payload
        if: steps.status.outputs.success == 'true'
        env:
          PLUGIN_VERSION: ${{ needs.publish.outputs.plugin_version }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
          JIRA_TICKETS: ${{ steps.jira-tickets.outputs.tickets }}
          ANDROID_SDK_VERSION: ${{ needs.publish.outputs.android_sdk_version }}
          IOS_SDK_VERSION: ${{ needs.publish.outputs.ios_sdk_version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const env = process.env;
          const text = [
            '<!here>',
            ':capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor:',
            '',
            `*Capacitor SDK ${env.PLUGIN_VERSION}* is published to Production.`,
            '',
            ':white_check_mark: rc-smoke/npm passed before promotion (verified by promote-release.yml).',
            '',
            '*Installation:*',
            ':npm: `npm install appsflyer-capacitor-plugin@latest`',
            'or pinned:',
            `:npm: \`npm install appsflyer-capacitor-plugin@${env.PLUGIN_VERSION}\``,
            '',
            '*Sources:*',
            `:github: Tree: https://github.com/${env.REPOSITORY}/tree/main`,
            `:github: Release: https://github.com/${env.REPOSITORY}/releases/tag/${env.TAG}`,
            `:github: Run: https://github.com/${env.REPOSITORY}/actions/runs/${env.RUN_ID}`,
            `:npm: https://www.npmjs.com/package/appsflyer-capacitor-plugin/v/${env.PLUGIN_VERSION}`,
            '',
            '*Changes and fixes:*',
            env.CHANGELOG_BODY || '• Check CHANGELOG.md for details',
            '',
            '*Linked tickets and issues:*',
            env.JIRA_TICKETS || 'No assigned fix version found',
            '',
            "*Native SDK's:*",
            `:android: ${env.ANDROID_SDK_VERSION}`,
            `:apple_company: ${env.IOS_SDK_VERSION}`,
            '',
            ':capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor:',
          ].join('\n');
          fs.appendFileSync(env.GITHUB_OUTPUT, `payload=${JSON.stringify({ text })}\n`);
          NODE

      - name: Send Slack notification (Success)
        if: steps.status.outputs.success == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          payload: ${{ steps.slack-success-payload.outputs.payload }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}

      - name: Build Slack failure payload
        id: slack-failure-payload
        if: steps.status.outputs.success == 'false'
        env:
          FAILED_STAGE: ${{ steps.status.outputs.failed_stage }}
          PLUGIN_VERSION: ${{ needs.publish.outputs.plugin_version || 'unknown' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const env = process.env;
          const text = [
            '<!here>',
            `:warning: *Capacitor production release failed at \`${env.FAILED_STAGE}\`*`,
            '',
            `Version: ${env.PLUGIN_VERSION}`,
            `Run: https://github.com/${env.REPOSITORY}/actions/runs/${env.RUN_ID}`,
            '',
            '*Stage results:*',
            `• publish: ${env.PUBLISH_RESULT}`,
          ].join('\n');
          fs.appendFileSync(env.GITHUB_OUTPUT, `payload=${JSON.stringify({ text })}\n`);
          NODE

      - name: Send Slack notification (Failure)
        if: steps.status.outputs.success == 'false'
        uses: slackapi/slack-github-action@v1
        with:
          payload: ${{ steps.slack-failure-payload.outputs.payload }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
