name: RC Release

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to cut the release from'
        required: true
        type: string
        default: develop
      plugin_version:
        description: 'Plugin RC version (X.Y.Z-rcN) or final hotfix build (X.Y.Z+N)'
        required: true
        type: string
      ios_sdk_version:
        description: 'iOS SDK version (X.Y.Z) — this is the AppsFlyerRPC pod/SPM pin, not AppsFlyerFramework'
        required: true
        type: string
      ios_framework_version:
        description: 'iOS AppsFlyerFramework-Static version (X.Y.Z) — required alongside ios_sdk_version; must be a known-good pairing (see checkPackageSwiftPins.sh)'
        required: true
        type: string
      android_sdk_version:
        description: 'Android SDK version (X.Y.Z)'
        required: true
        type: string
      android_plugin_bridge_version:
        description: 'Android af-android-plugin-bridge version (X.Y.Z) — required alongside android_sdk_version'
        required: true
        type: string
      skip_unit:
        description: 'Skip lint + unit checks (fast iteration)'
        required: false
        type: boolean
        default: false
      skip_e2e:
        description: 'Skip iOS + Android E2E gates (DRY-RUN ONLY)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Skip npm publish + PR + Slack (rehearsal mode)'
        required: false
        type: boolean
        default: false

concurrency:
  group: rc-release-${{ github.workflow }}-${{ github.event.inputs.plugin_version }}
  cancel-in-progress: false

env:
  VERSION_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+|\+[0-9]+)$'
  SDK_VERSION_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  validate-release:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.compute.outputs.release_branch }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
    steps:
      - name: Validate version regexes
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          IOS_SDK_VERSION: ${{ inputs.ios_sdk_version }}
          IOS_FRAMEWORK_VERSION: ${{ inputs.ios_framework_version }}
          ANDROID_SDK_VERSION: ${{ inputs.android_sdk_version }}
          ANDROID_PLUGIN_BRIDGE_VERSION: ${{ inputs.android_plugin_bridge_version }}
        run: |
          if ! [[ "$PLUGIN_VERSION" =~ $VERSION_REGEX ]]; then
            echo "Plugin version '$PLUGIN_VERSION' does not match $VERSION_REGEX"
            exit 1
          fi
          if ! [[ "$IOS_SDK_VERSION" =~ $SDK_VERSION_REGEX ]]; then
            echo "iOS SDK version '$IOS_SDK_VERSION' does not match $SDK_VERSION_REGEX"
            exit 1
          fi
          if ! [[ "$IOS_FRAMEWORK_VERSION" =~ $SDK_VERSION_REGEX ]]; then
            echo "iOS Framework version '$IOS_FRAMEWORK_VERSION' does not match $SDK_VERSION_REGEX"
            exit 1
          fi
          if ! [[ "$ANDROID_SDK_VERSION" =~ $SDK_VERSION_REGEX ]]; then
            echo "Android SDK version '$ANDROID_SDK_VERSION' does not match $SDK_VERSION_REGEX"
            exit 1
          fi
          if ! [[ "$ANDROID_PLUGIN_BRIDGE_VERSION" =~ $SDK_VERSION_REGEX ]]; then
            echo "Android plugin bridge version '$ANDROID_PLUGIN_BRIDGE_VERSION' does not match $SDK_VERSION_REGEX"
            exit 1
          fi
          echo "Inputs OK"
      - id: compute
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          MAJOR=$(echo "$PLUGIN_VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$PLUGIN_VERSION" | cut -d'.' -f2)
          # Strips whichever suffix is present: -rcN or +N (never both).
          PATCH=$(echo "$PLUGIN_VERSION" | cut -d'.' -f3 | cut -d'-' -f1 | cut -d'+' -f1)
          BRANCH="releases/${MAJOR}.x.x/${MAJOR}.${MINOR}.x/${PLUGIN_VERSION}"
          TAG="v${PLUGIN_VERSION}"
          echo "release_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release branch: $BRANCH"
          echo "Tag: $TAG"

  prepare-branch:
    name: RC-PREP — bump versions and push branch
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_branch: ${{ needs.validate-release.outputs.release_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Create release branch
        env:
          RELEASE_BRANCH: ${{ needs.validate-release.outputs.release_branch }}
        run: |
          BRANCH="$RELEASE_BRANCH"
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists on origin; checking it out"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run updatePlugin.sh (bump versions + RC suffix)
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          IOS_SDK_VERSION: ${{ inputs.ios_sdk_version }}
          IOS_FRAMEWORK_VERSION: ${{ inputs.ios_framework_version }}
          ANDROID_SDK_VERSION: ${{ inputs.android_sdk_version }}
          ANDROID_PLUGIN_BRIDGE_VERSION: ${{ inputs.android_plugin_bridge_version }}
        run: |
          chmod +x .github/workflows/scripts/*.sh
          .github/workflows/scripts/updatePlugin.sh \
            pluginVersion="$PLUGIN_VERSION" \
            buildNumber="$BUILD_NUMBER" \
            iOSVersion="$IOS_SDK_VERSION" \
            iOSFrameworkVersion="$IOS_FRAMEWORK_VERSION" \
            androidVersion="$ANDROID_SDK_VERSION" \
            androidPluginBridgeVersion="$ANDROID_PLUGIN_BRIDGE_VERSION"

      - name: Commit version bump
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No version diff to commit (likely re-running same RC)."
          else
            git commit -m "chore: bump plugin to $PLUGIN_VERSION (CI)"
          fi

      - name: Push release branch
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ needs.validate-release.outputs.release_branch }}
        run: |
          BRANCH="$RELEASE_BRANCH"
          git push -u "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"

  run-ci:
    name: Lint, Test & Build
    needs: [validate-release, prepare-branch]
    if: ${{ inputs.skip_unit != true }}
    uses: ./.github/workflows/lint-test-build.yml
    with:
      skip_unit: false
      skip_builds: false

  run-e2e-ios:
    name: iOS E2E
    needs: [validate-release, prepare-branch]
    if: ${{ inputs.skip_e2e != true }}
    uses: ./.github/workflows/ios-e2e.yml
    with:
      ref: ${{ needs.validate-release.outputs.release_branch }}
    secrets: inherit

  run-e2e-android:
    name: Android E2E
    needs: [validate-release, prepare-branch]
    if: ${{ inputs.skip_e2e != true }}
    uses: ./.github/workflows/android-e2e.yml
    with:
      ref: ${{ needs.validate-release.outputs.release_branch }}
    secrets: inherit

  pre-publish-gate:
    name: Pre-publish gate
    needs: [validate-release, run-ci, run-e2e-ios, run-e2e-android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded (or skipped legitimately)
        env:
          CI_RESULT: ${{ needs.run-ci.result }}
          IOS_RESULT: ${{ needs.run-e2e-ios.result }}
          ANDROID_RESULT: ${{ needs.run-e2e-android.result }}
          SKIP_E2E: ${{ inputs.skip_e2e }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ci_result="$CI_RESULT"
          ios_result="$IOS_RESULT"
          android_result="$ANDROID_RESULT"

          fail=0
          for pair in "ci:$ci_result" "ios:$ios_result" "android:$android_result"; do
            name="${pair%%:*}"
            res="${pair##*:}"
            case "$res" in
              success|skipped)
                echo "$name: $res"
                ;;
              *)
                echo "::error::$name gate failed with result '$res'"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          if [ "$SKIP_E2E" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::skip_e2e is only allowed when dry_run=true"
            exit 1
          fi

  publish-rc:
    name: RC-PUBLISH — npm publish --tag QA
    needs: [validate-release, pre-publish-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.set-publish-out.outputs.published }}
    env:
      GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
    steps:
      - name: Assert npm OIDC workflow is active
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GH_REPO}/actions/workflows/npm-publish-oidc.yml" --jq '.state' 2>/dev/null || echo "missing")"
          if [ "$state" != "active" ]; then
            echo "::error::npm-publish-oidc.yml is not active on the default branch (state=$state)."
            exit 1
          fi

      - name: Dispatch npm OIDC publish workflow and wait
        id: dispatch
        env:
          # This job does not checkout; gh needs an explicit repo (no .git in cwd).
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.validate-release.outputs.release_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PREV="$(gh run list --workflow=npm-publish-oidc.yml --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId // empty')"
          gh workflow run npm-publish-oidc.yml --ref "$BRANCH" \
            -f "git_ref=$BRANCH" \
            -f "dist_tag=QA" \
            -f "dry_run=$DRY_RUN"
          run_id=""
          for _ in $(seq 1 120); do
            cur="$(gh run list --workflow=npm-publish-oidc.yml --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId // empty')"
            if [[ -n "$cur" && "$cur" != "$PREV" ]]; then
              run_id="$cur"
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Timed out waiting for npm-publish-oidc.yml run to appear on branch $BRANCH"
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Set published output
        id: set-publish-out
        if: success()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  create-prerelease-tag:
    name: Create prerelease tag
    needs: [validate-release, publish-rc]
    if: ${{ inputs.dry_run != true && needs.publish-rc.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub prerelease
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_BRANCH: ${{ needs.validate-release.outputs.release_branch }}
        with:
          github-token: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            const branch = process.env.RELEASE_BRANCH;
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: branch,
                name: tag,
                prerelease: true,
                generate_release_notes: false,
                body: `Release candidate \`${tag}\` published to npm under the \`QA\` dist-tag. Awaiting smoke + promote.`,
              });
            } catch (err) {
              core.setFailed(`Failed to create prerelease: ${err.message}`);
            }

  open-pr:
    name: Open PR to main
    needs: [validate-release, publish-rc]
    if: ${{ inputs.dry_run != true && needs.publish-rc.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_branch }}
          token: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          BRANCH: ${{ needs.validate-release.outputs.release_branch }}
          VERSION: ${{ inputs.plugin_version }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --json number,state --jq '.[] | select(.state=="OPEN") | .number' | head -1)
          body=$(cat <<EOF
          Auto-generated PR for release candidate \`$VERSION\`.

          Pipeline status checks (all four must be green before promote):
          - Lint, Test & Build
          - iOS E2E
          - Android E2E
          - rc-smoke/npm

          When QA approves, apply the **pass QA ready for deploy** label. The promote-release workflow will strip \`-rcN\` (or publish a final \`+N\` hotfix build as-is) and let you merge into main.
          EOF
          )
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Release ${VERSION}" \
              --body "$body"
          else
            gh pr edit "$existing" --body "$body" --title "Release ${VERSION}"
          fi

  dispatch-rc-smoke:
    name: Dispatch RC smoke
    needs: [validate-release, publish-rc, create-prerelease-tag, open-pr]
    if: ${{ inputs.dry_run != true && needs.publish-rc.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert RC smoke workflow is active
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GH_REPO}/actions/workflows/rc-smoke.yml" --jq '.state' 2>/dev/null || echo "missing")"
          if [ "$state" != "active" ]; then
            echo "::error::rc-smoke.yml is not active on the default branch (state=$state)."
            exit 1
          fi

      - name: Dispatch RC smoke workflow
        env:
          GH_TOKEN: ${{ secrets.CI_DEV_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.validate-release.outputs.release_branch }}
          RC_VERSION: ${{ inputs.plugin_version }}
        run: |
          set -euo pipefail
          gh workflow run rc-smoke.yml --ref "$BRANCH" \
            -f "rc_version=$RC_VERSION" \
            -f "release_branch=$BRANCH"
          echo "Dispatched rc-smoke.yml for $RC_VERSION on $BRANCH"

  notify-team:
    name: Notify Slack
    needs:
      - validate-release
      - prepare-branch
      - run-ci
      - run-e2e-ios
      - run-e2e-android
      - pre-publish-gate
      - publish-rc
      - create-prerelease-tag
      - open-pr
      - dispatch-rc-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Status + legs run env-only and first so the failure Slack still fires even if checkout/Jira are unhappy (mirrors Flutter's notify-team).
      - name: Determine status and failed stage
        id: status
        env:
          VALIDATE_RESULT: ${{ needs.validate-release.result }}
          PREPARE_RESULT: ${{ needs.prepare-branch.result }}
          GATE_RESULT: ${{ needs.pre-publish-gate.result }}
          PUBLISH_RESULT: ${{ needs.publish-rc.result }}
          PRERELEASE_RESULT: ${{ needs.create-prerelease-tag.result }}
          OPEN_PR_RESULT: ${{ needs.open-pr.result }}
          SMOKE_DISPATCH_RESULT: ${{ needs.dispatch-rc-smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$VALIDATE_RESULT" == "success" \
             && "$PREPARE_RESULT"   == "success" \
             && "$GATE_RESULT"      == "success" \
             && "$PUBLISH_RESULT"   == "success" \
             && "$PRERELEASE_RESULT" == "success" \
             && "$OPEN_PR_RESULT"    == "success" \
             && "$SMOKE_DISPATCH_RESULT" == "success" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "failed_stage=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "success=false" >> "$GITHUB_OUTPUT"
          # Top-down attribution; first non-success owns the failure.
          if   [[ "$VALIDATE_RESULT"  != "success" ]]; then echo "failed_stage=validate-release"   >> "$GITHUB_OUTPUT"
          elif [[ "$PREPARE_RESULT"   != "success" ]]; then echo "failed_stage=prepare-branch"     >> "$GITHUB_OUTPUT"
          elif [[ "$GATE_RESULT"      != "success" ]]; then echo "failed_stage=pre-publish-gate"   >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH_RESULT"   != "success" ]]; then echo "failed_stage=publish-rc"         >> "$GITHUB_OUTPUT"
          elif [[ "$PRERELEASE_RESULT" != "success" ]]; then echo "failed_stage=create-prerelease-tag" >> "$GITHUB_OUTPUT"
          elif [[ "$OPEN_PR_RESULT"    != "success" ]]; then echo "failed_stage=open-pr" >> "$GITHUB_OUTPUT"
          else echo "failed_stage=dispatch-rc-smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Format pre-publish leg results
        id: legs
        env:
          CI_RESULT: ${{ needs.run-ci.result }}
          E2E_IOS_RESULT: ${{ needs.run-e2e-ios.result }}
          E2E_ANDROID_RESULT: ${{ needs.run-e2e-android.result }}
        run: |
          set -euo pipefail
          # CI accepts skipped as a pass (skip_unit); E2E does not (skip_e2e is dry-run-only).
          icon_for() {
            local kind="$1" result="$2"
            case "$result" in
              success)   echo ":white_check_mark:" ;;
              skipped)
                if [[ "$kind" == "ci" ]]; then echo ":fast_forward:"; else echo ":x:"; fi ;;
              failure)   echo ":x:" ;;
              cancelled) echo ":no_entry_sign:" ;;
              *)         echo ":grey_question:" ;;
            esac
          }
          {
            echo "ci_icon=$(icon_for ci "$CI_RESULT")"
            echo "ios_icon=$(icon_for e2e "$E2E_IOS_RESULT")"
            echo "android_icon=$(icon_for e2e "$E2E_ANDROID_RESULT")"
            echo "ci_result=$CI_RESULT"
            echo "e2e_ios_result=$E2E_IOS_RESULT"
            echo "e2e_android_result=$E2E_ANDROID_RESULT"
          } >> "$GITHUB_OUTPUT"

      # Enrichment runs only on the success path; failure Slack below only reads needs.*.result + inputs, so a checkout/Jira blip can't silence it.
      - name: Checkout release branch
        if: steps.status.outputs.success == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.release_branch }}

      - name: Compute base version
        id: base
        if: steps.status.outputs.success == 'true'
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          source .github/workflows/scripts/version-format.sh
          # Strips -rcN and final +N hotfix suffixes alike — Jira fixVersion is keyed to X.Y.Z.
          BASE_VERSION=$(echo "$PLUGIN_VERSION" | sed -E "s/(${VERSION_SUFFIX_RC}|${VERSION_SUFFIX_BUILD})\$//")
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch Jira tickets
        id: jira-tickets
        if: steps.status.outputs.success == 'true'
        continue-on-error: true
        env:
          JIRA_EMAIL: ${{ secrets.CI_JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.CI_JIRA_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.CI_JIRA_DOMAIN }}
          BASE_VERSION: ${{ steps.base.outputs.base_version }}
        run: |
          set +e
          JIRA_FIX_VERSION="Capacitor SDK v${BASE_VERSION}"
          echo "Looking for Jira tickets with fixVersion: $JIRA_FIX_VERSION"

          if [[ -z "$JIRA_EMAIL" || -z "$JIRA_TOKEN" ]]; then
            echo "Jira credentials not configured; skipping ticket fetch"
            echo "tickets=No assigned fix version found" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOMAIN="${JIRA_DOMAIN:-appsflyer.atlassian.net}"

          JQL_QUERY="fixVersion=\"${JIRA_FIX_VERSION}\""
          ENCODED_JQL=$(echo "$JQL_QUERY" | jq -sRr @uri)

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://${DOMAIN}/rest/api/3/search/jql?jql=${ENCODED_JQL}&fields=key,summary&maxResults=20")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Jira HTTP $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Jira API request failed; first 500 bytes of body:"
            echo "$BODY" | head -c 500
            echo "tickets=No assigned fix version found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TICKETS=$(echo "$BODY" | jq -r '.issues[]? | "• https://'"${DOMAIN}"'/browse/\(.key) - \(.fields.summary)"' 2>/dev/null | head -10)
          if [ -z "$TICKETS" ]; then
            echo "tickets=No assigned fix version found" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tickets<<EOF"
              echo "$TICKETS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build Slack success payload
        id: slack-success-payload
        # Skip during dry runs so iterative pipeline testing doesn't spam the QA channel.
        if: steps.status.outputs.success == 'true' && inputs.dry_run != true
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          CI_ICON: ${{ steps.legs.outputs.ci_icon }}
          CI_RESULT: ${{ steps.legs.outputs.ci_result }}
          IOS_ICON: ${{ steps.legs.outputs.ios_icon }}
          IOS_RESULT: ${{ steps.legs.outputs.e2e_ios_result }}
          ANDROID_ICON: ${{ steps.legs.outputs.android_icon }}
          ANDROID_RESULT: ${{ steps.legs.outputs.e2e_android_result }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.validate-release.outputs.release_branch }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RUN_ID: ${{ github.run_id }}
          JIRA_TICKETS: ${{ steps.jira-tickets.outputs.tickets }}
          ANDROID_SDK_VERSION: ${{ inputs.android_sdk_version }}
          ANDROID_PLUGIN_BRIDGE_VERSION: ${{ inputs.android_plugin_bridge_version }}
          IOS_SDK_VERSION: ${{ inputs.ios_sdk_version }}
          IOS_FRAMEWORK_VERSION: ${{ inputs.ios_framework_version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const env = process.env;
          const text = [
            '<!here>',
            ':capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor:',
            '',
            '*Capacitor Release Candidate:*',
            `appsflyer-capacitor-plugin: ${env.PLUGIN_VERSION} is ready for QA testing.`,
            '',
            '*Pre-publish checks:*',
            `${env.CI_ICON} Lint, Test & Build: ${env.CI_RESULT}`,
            `${env.IOS_ICON} RC-E2E iOS: ${env.IOS_RESULT}`,
            `${env.ANDROID_ICON} RC-E2E Android: ${env.ANDROID_RESULT}`,
            '',
            `:hourglass_flowing_sand: Smoke (\`rc-smoke/npm\`) will auto-run once ${env.PLUGIN_VERSION} appears on npm (typically 1-5 min).`,
            '',
            '*Installation:*',
            ':npm: `npm install appsflyer-capacitor-plugin@QA`',
            'or pinned:',
            `:npm: \`npm install appsflyer-capacitor-plugin@${env.PLUGIN_VERSION}\``,
            '',
            '*Sources:*',
            `:github: Branch: https://github.com/${env.REPOSITORY}/tree/${env.RELEASE_BRANCH}`,
            `:github: Prerelease: https://github.com/${env.REPOSITORY}/releases/tag/${env.TAG_NAME}`,
            `:github: Run: https://github.com/${env.REPOSITORY}/actions/runs/${env.RUN_ID}`,
            `:npm: https://www.npmjs.com/package/appsflyer-capacitor-plugin/v/${env.PLUGIN_VERSION}`,
            '',
            '*Linked tickets and issues:*',
            env.JIRA_TICKETS || 'No assigned fix version found',
            '',
            "*Native SDK's:*",
            `:android: ${env.ANDROID_SDK_VERSION}`,
            `:gear: af-android-plugin-bridge ${env.ANDROID_PLUGIN_BRIDGE_VERSION}`,
            `:apple_company: AppsFlyerRPC ${env.IOS_SDK_VERSION}`,
            `:gear: AppsFlyerFramework-Static ${env.IOS_FRAMEWORK_VERSION}`,
            '',
            ':capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor::capacitor:',
          ].join('\n');
          fs.appendFileSync(env.GITHUB_OUTPUT, `payload=${JSON.stringify({ text })}\n`);
          NODE

      - name: Send Slack notification (Success)
        if: steps.status.outputs.success == 'true' && inputs.dry_run != true
        uses: slackapi/slack-github-action@v1
        with:
          payload: ${{ steps.slack-success-payload.outputs.payload }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}

      - name: Build Slack failure payload
        id: slack-failure-payload
        if: steps.status.outputs.success == 'false' && inputs.dry_run != true
        env:
          FAILED_STAGE: ${{ steps.status.outputs.failed_stage }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          RELEASE_BRANCH: ${{ needs.validate-release.outputs.release_branch }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CI_ICON: ${{ steps.legs.outputs.ci_icon }}
          CI_RESULT: ${{ steps.legs.outputs.ci_result }}
          IOS_ICON: ${{ steps.legs.outputs.ios_icon }}
          IOS_RESULT: ${{ steps.legs.outputs.e2e_ios_result }}
          ANDROID_ICON: ${{ steps.legs.outputs.android_icon }}
          ANDROID_RESULT: ${{ steps.legs.outputs.e2e_android_result }}
          PREPARE_RESULT: ${{ needs.prepare-branch.result }}
          GATE_RESULT: ${{ needs.pre-publish-gate.result }}
          PUBLISH_RESULT: ${{ needs.publish-rc.result }}
          PRERELEASE_RESULT: ${{ needs.create-prerelease-tag.result }}
          OPEN_PR_RESULT: ${{ needs.open-pr.result }}
          SMOKE_DISPATCH_RESULT: ${{ needs.dispatch-rc-smoke.result }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const env = process.env;
          const text = [
            '<!here>',
            `:warning: *Capacitor RC failed at \`${env.FAILED_STAGE}\`*`,
            '',
            `Version: ${env.PLUGIN_VERSION}`,
            `Branch: ${env.RELEASE_BRANCH}`,
            `Run: https://github.com/${env.REPOSITORY}/actions/runs/${env.RUN_ID}`,
            '',
            '*Pre-publish checks:*',
            `${env.CI_ICON} Lint, Test & Build: ${env.CI_RESULT}`,
            `${env.IOS_ICON} RC-E2E iOS: ${env.IOS_RESULT}`,
            `${env.ANDROID_ICON} RC-E2E Android: ${env.ANDROID_RESULT}`,
            '',
            '*Downstream stages:*',
            `• prepare-branch: ${env.PREPARE_RESULT}`,
            `• pre-publish-gate: ${env.GATE_RESULT}`,
            `• publish-rc: ${env.PUBLISH_RESULT}`,
            `• create-prerelease-tag: ${env.PRERELEASE_RESULT}`,
            `• open-pr: ${env.OPEN_PR_RESULT}`,
            `• dispatch-rc-smoke: ${env.SMOKE_DISPATCH_RESULT}`,
          ].join('\n');
          fs.appendFileSync(env.GITHUB_OUTPUT, `payload=${JSON.stringify({ text })}\n`);
          NODE

      - name: Send Slack notification (Failure)
        if: steps.status.outputs.success == 'false' && inputs.dry_run != true
        uses: slackapi/slack-github-action@v1
        with:
          payload: ${{ steps.slack-failure-payload.outputs.payload }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
